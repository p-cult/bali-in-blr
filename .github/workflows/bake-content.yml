# Bake the site-copy Google Doc into index.html every hour.
#
# The page already swaps the Doc's text in live for each visitor (main.js
# loadContent). This job keeps the printed wording in index.html itself current
# too, so search engines, link previews, visitors with scripts blocked and the
# offline fallback all see the latest text. The live swap stays: it covers the
# gap between runs.
#
# tools/bake-content.py never wipes anything: if the feed is unreachable,
# malformed or suspiciously small it changes nothing and exits 0. It compares
# the wording, not the markup, and only rewrites elements whose text differs
# from the Doc; when nothing differs there is no write and no commit. A
# difference is baked only once it is unchanged at two hourly checks in a row
# (settle-first), so a half-finished edit is never baked.
name: Bake site copy

on:
  schedule:
    - cron: "43 * * * *"   # hourly, off the hour and off the image sync
  workflow_dispatch:        # and on demand from the Actions tab
    inputs:
      now:
        description: "Bake straight away (skip the settle check)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bake-content
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Remembers what differed at the previous check (a hash, no content) so a
      # difference is only baked once it has stayed the same for a full hour.
      - name: Restore the previous check
        uses: actions/cache/restore@v4
        with:
          path: .bake-state
          key: bake-state-none
          restore-keys: bake-state-

      - name: Compare the Doc with index.html and bake only what differs
        env:
          BAKE_NOW: ${{ inputs.now && '1' || '' }}
        run: python3 tools/bake-content.py

      - name: Remember this check
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bake-state
          key: bake-state-${{ github.run_id }}

      - name: Commit if the wording changed
        run: |
          if [ -z "$(git status --porcelain index.html)" ]; then
            echo "No wording changes. Done."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bake site copy from the Doc (automated)

          The Doc differed from index.html for: $(cat .bake-changed)
          (.github/workflows/bake-content.yml)"
          git pull --rebase origin main
          git push
