<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin — Bali in Bengaluru</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,600;125,700;125,900&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#1B1D21; --bg3:#23262B; --ink:#EFE7D8; --muted:#B6B2AA; --muted2:#8C8E92;
    --accent:#ff5a3c; --copper:#C87941; --line:#2C3036; --radius:8px;
    --display:"Archivo","Arial Narrow",sans-serif; --sans:"Instrument Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;padding:2.5rem 1.5rem 5rem}
  .wrap{max-width:820px;margin:0 auto}
  .kick{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.2em;font-size:.7rem;color:var(--copper);margin:0 0 .4rem}
  h1{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:1.9rem;letter-spacing:-.01em;margin:0 0 .3rem}
  .sub{color:var(--muted2);margin:0 0 2rem;font-size:.95rem}
  .topbar{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;margin-bottom:1.6rem}
  .who{font-size:.85rem;color:var(--muted2)}
  .who b{color:var(--ink);font-weight:600}
  .signout{background:none;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:.8rem;border-radius:5px;padding:.35rem .8rem;cursor:pointer}
  .signout:hover{border-color:var(--ink)}
  .tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem}
  .tool{display:block;background:var(--bg3);border:1px solid var(--line);border-radius:var(--radius);padding:1.3rem;text-decoration:none;color:inherit;transition:.15s}
  .tool:hover{border-color:var(--accent);transform:translateY(-1px)}
  .tool h2{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:1rem;letter-spacing:.03em;margin:0 0 .35rem}
  .tool p{margin:0;color:var(--muted2);font-size:.85rem}
  .tool .arrow{color:var(--copper);font-weight:700}
  footer{margin-top:2.5rem;color:var(--muted2);font-size:.78rem}
  footer a{color:var(--copper)}
</style>
</head>
<body>
<div class="wrap" id="admin-app" hidden>
  <div class="topbar">
    <p class="kick">Bali in Bengaluru · internal</p>
    <span class="who">Signed in as <b id="who">—</b> · <button class="signout" id="signout" type="button">Sign out</button></span>
  </div>

  <h1>Admin</h1>
  <p class="sub">Internal tools for the festival hub. Pick a tool below.</p>

  <div class="tools">
    <a class="tool" href="campaign-links.html">
      <h2>Campaign Link Builder <span class="arrow">&rarr;</span></h2>
      <p>Mint trackable UTM links and QR codes for posters, posts and ads. Saves to the master links sheet.</p>
    </a>
    <!-- Add more admin tools here as they are built. -->
  </div>

  <footer>
    Bali in Bengaluru · <a href="../">Public site</a>
  </footer>
</div>

<script src="auth.js"></script>
<script>
  AdminAuth.protect({
    onUnlock: function (user) {
      document.getElementById("who").textContent = user;
    },
  });
  document.getElementById("signout").addEventListener("click", AdminAuth.signOut);
</script>
</body>
</html>
