# Project facts. The brain holds shape; this file holds everything specific
# to {{PROJECT}}. Tools in .brain/tools read from here, so the brain itself
# stays free of project detail.
#
# Anything secret (ids, keys) belongs in the sealed vault, not here.

PROJECT_NAME="{{PROJECT}}"

# Where the public thing lives. Blank if there is no public surface.
LIVE_URL=""

# Read-only endpoints worth checking. Space-separated. A health check hits
# these; they should need no credentials.
HEALTH_URLS=""

# The content source of truth (a published sheet URL, an API, a CMS).
SOURCE_URL=""

# Vault key location. The key lives OUTSIDE the repo and never in git.
VAULT_KEY=""

# Files whose cache-busting version must move together when any one changes.
VERSIONED_ASSETS=""
